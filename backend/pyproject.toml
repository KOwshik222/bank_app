[project]
name = "ai-banking-incident-agent"
version = "1.0.0"
description = "AI-Powered Banking Incident Resolution & Root Cause Analysis Agent"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    # Validation & Settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # HTTP client
    "httpx>=0.27.0",
    # AI / ML
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.0.0",
    "shap>=0.45.0",
    "joblib>=1.4.0",
    # GenAI / RAG
    "ollama>=0.3.0",
    "qdrant-client>=1.9.0",
    # Utilities
    "jinja2>=3.1.0",
    "structlog>=24.1.0",
    "python-dateutil>=2.9.0",
    "uuid6>=2024.1.12",
    # SSE for real-time updates
    "sse-starlette>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*", "ai*", "simulator*"]

[tool.ruff]
target-version = "py311"
line-length = 100
