version: "3.8"

services:
  # ============================================================================
  # FastAPI Application Backend + Embedded Incident Command Center
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: bankops-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=sqlite+aiosqlite:////app/backend/bank_app.db
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_HOST=http://ollama:11434
      - JWT_SECRET=bankops-super-secret-key-change-in-production-min-32-chars
      - CORS_ORIGINS=["http://localhost:8000","http://localhost:3000"]
    volumes:
      - backend_db:/app/backend/data
      - ./backend/knowledge_base:/app/backend/knowledge_base:ro
      - ./backend/ai/ml_models:/app/backend/ai/ml_models
    depends_on:
      qdrant:
        condition: service_started
      prometheus:
        condition: service_started
    networks:
      - bankops-net

  # ============================================================================
  # Qdrant Vector Search Engine (RAG Vector Store)
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: bankops-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - bankops-net

  # ============================================================================
  # Local LLM Engine (Ollama)
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: bankops-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - bankops-net

  # ============================================================================
  # Prometheus Observability & Metrics Scraper
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: bankops-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - bankops-net

  # ============================================================================
  # Grafana Dashboard Visualization
  # ============================================================================
  grafana:
    image: grafana/grafana:11.0.0
    container_name: bankops-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - bankops-net

networks:
  bankops-net:
    driver: bridge

volumes:
  backend_db:
  qdrant_data:
  ollama_models:
  prometheus_data:
  grafana_data:
